# Local DNS records for services on this infra host.
#
# Caddy (proxy/) routes by Host header, so apps that get their own vhost need a
# name that resolves to this node's tailnet IP - browsing to the IP directly
# lands on the catch-all site (Pi-hole) instead. These records provide that name
# for every client using this Pi-hole as its DNS.
#
# Loaded from /etc/dnsmasq.d/ because FTLCONF_misc_etc_dnsmasq_d=true.
# After editing: docker compose restart pihole
#
# address=/<name>/<ip> also covers every subdomain of <name>.
# The tailnet IP is stable as long as TS_AUTHKEY is non-ephemeral and the node
# is not deleted from the tailnet.

# PennyPilot / Compass -> this node's tailnet IP.
address=/compass.infra/100.67.102.88
