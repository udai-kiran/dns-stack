# SafeSearch enforcement (managed by the infra repo).
#
# Forces each search engine to its "safe" endpoint via a DNS CNAME, the same
# technique NextDNS uses. Loaded by FTL because FTLCONF_misc_etc_dnsmasq_d=true.
# dnsmasq syntax: cname=<alias>[,<alias>...],<target>  (last field is the target;
# the target is resolved upstream through Unbound).
#
# Note: this only covers engines that publish a forced-safe hostname. To also
# block engines that don't support it, add them to a Pi-hole blocklist/deny.

# ── Google → forcesafesearch.google.com ──
# .com plus the common country domains. Add more google.<tld> aliases as needed.
cname=www.google.com,google.com,forcesafesearch.google.com
cname=www.google.ac,www.google.ad,www.google.ae,www.google.com.au,www.google.at,www.google.be,www.google.com.br,www.google.ca,www.google.ch,www.google.cl,www.google.co.in,www.google.co.jp,www.google.co.nz,www.google.co.uk,www.google.co.za,www.google.com.mx,www.google.com.tr,www.google.cz,www.google.de,www.google.dk,www.google.es,www.google.fi,www.google.fr,www.google.gr,www.google.hu,www.google.ie,www.google.it,www.google.nl,www.google.no,www.google.pl,www.google.pt,www.google.ro,www.google.ru,www.google.se,forcesafesearch.google.com

# ── Bing → strict.bing.com ──
cname=www.bing.com,bing.com,strict.bing.com

# ── DuckDuckGo → safe.duckduckgo.com ──
cname=duckduckgo.com,www.duckduckgo.com,safe.duckduckgo.com

# ── YouTube Restricted Mode (Strict) → restrict.youtube.com ──
# Swap the target to restrictmoderate.youtube.com for Moderate instead of Strict.
cname=www.youtube.com,m.youtube.com,youtube.com,youtubei.googleapis.com,youtube.googleapis.com,www.youtube-nocookie.com,restrict.youtube.com
