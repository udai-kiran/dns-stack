server:
    # Recursive resolver lives only on the isolated dns_net bridge network
    # (static IP 172.30.0.2) and publishes no ports to the host. Pi-hole
    # (network_mode: host) reaches it directly over that bridge subnet, since
    # the bridge interface lives on the host - but nothing outside the host
    # can reach it because no port is ever published for this container.
    interface: 172.30.0.2@5335
    port: 5335

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    access-control: 172.30.0.0/24 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse

    username: "_unbound"
    directory: "/opt/unbound/etc/unbound"
    chroot: "/opt/unbound/etc/unbound"

    # Logging - sent to stderr so it shows up in `docker logs unbound`.
    # Per-query/reply logging is OFF for privacy: with it on, `docker logs
    # unbound` becomes a plaintext record of every site anyone visits. Turn
    # log-queries/log-replies back on temporarily only when debugging.
    verbosity: 1
    log-queries: no
    log-replies: no
    use-syslog: no
    logfile: ""

    # Performance
    num-threads: 2
    msg-cache-size: 64m
    rrset-cache-size: 128m
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    so-reuseport: yes
    edns-buffer-size: 1232
    rrset-roundrobin: yes
    minimal-responses: yes

    # Privacy / hardening
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-algo-downgrade: yes
    use-caps-for-id: no
    deny-any: yes
    # Don't reveal the configured DNSSEC trust anchor via a chaos-class query.
    hide-trustanchor: yes

    # DNSSEC: configuring a trust anchor is what turns on full validation.
    # unbound-anchor bootstraps/updates var/root.key on every container start
    # (see image entrypoint); the var/ directory is on a named volume so the
    # RFC 5011 tracked key persists across restarts instead of being rebuilt
    # from scratch each time.
    auto-trust-anchor-file: "var/root.key"

    # Use cached DNSSEC NSEC/NSEC3 records to answer (and synthesize NXDOMAIN
    # for) queries locally, so fewer lookups leave the network - a privacy and
    # latency win. Requires DNSSEC validation, which is on above.
    aggressive-nsec: yes

    # Attach Extended DNS Error codes (RFC 8914), e.g. "DNSSEC Bogus", so
    # `dig` shows *why* a query failed validation instead of a bare SERVFAIL.
    ede: yes
    ede-serve-expired: yes
    # 1 (not 2) so a DNSSEC failure logs that it happened without printing the
    # queried domain name on every bogus reply.
    val-log-level: 1

    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
    private-address: ::ffff:0:0/96

    include: /opt/unbound/etc/unbound/a-records.conf
    include: /opt/unbound/etc/unbound/srv-records.conf

remote-control:
    control-enable: no
